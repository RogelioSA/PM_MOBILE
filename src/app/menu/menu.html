<!-- menu.html -->

<!-- Header fijo -->
<div class="fixed top-0 left-0 right-0 z-50 bg-white dark:bg-slate-800 shadow-md h-16 flex items-center px-4">
  <div class="flex items-center justify-between w-full">

    <p-button icon="pi pi-bars"
      (onClick)="toggleDrawer()"
      styleClass="p-button-text p-button-rounded"></p-button>

    <span class="text-xl font-bold absolute left-1/2 transform -translate-x-1/2 text-gray-800 dark:text-white">
      PERUMOTOR
    </span>

    <div class="flex items-center gap-1 sm:gap-2">
      <p-button [icon]="isDarkMode ? 'pi pi-sun' : 'pi pi-moon'"
        (onClick)="toggleDarkMode()"
        styleClass="p-button-rounded p-button-text"
        [pTooltip]="isDarkMode ? 'Modo claro' : 'Modo oscuro'"
        tooltipPosition="bottom"></p-button>

      <p-button
        label="Cerrar Sesión"
        icon="pi pi-sign-out"
        (onClick)="logout()"
        severity="danger"
        size="small"
        styleClass="logout-button"
        aria-label="Cerrar sesión"></p-button>
    </div>

  </div>
</div>

<!-- Drawer -->
<p-drawer [(visible)]="drawerVisible" position="left" [style]="{'width': '280px'}" styleClass="!bg-white dark:!bg-slate-800 shadow-2xl">

  <ng-template pTemplate="header">
    <div class="flex items-center gap-2">
      <span class="font-bold text-xl text-gray-800 dark:text-white">PERUMOTOR</span>
    </div>
  </ng-template>

  <div class="flex flex-col gap-1 mt-4 px-2">

    <!-- Cargando permisos -->
    <div *ngIf="cargandoPermisos" class="flex flex-col gap-2 px-2 py-4">
      <div *ngFor="let _ of [1,2,3,4,5]"
        class="h-10 rounded-lg bg-gray-200 dark:bg-slate-600 animate-pulse"></div>
    </div>

    <!-- Items filtrados por permisos -->
    <ng-container *ngIf="!cargandoPermisos">

      <p-button *ngFor="let item of items"
        [label]="item.label || ''"
        [icon]="item.icon || ''"
        (onClick)="executeCommand(item)"
        [styleClass]="getButtonClass(item)">
      </p-button>

      <!-- Sin accesos -->
      <div *ngIf="items.length === 0"
        class="text-center py-8 text-gray-400 dark:text-gray-500 text-sm">
        <i class="pi pi-lock text-2xl block mb-2 opacity-50"></i>
        Sin accesos asignados
      </div>

    </ng-container>

  </div>

</p-drawer>
